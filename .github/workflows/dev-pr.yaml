name: wf-dev-ci
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  dev-pr-validation-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run: npx stylelint "**/*.css"